<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="carb-severance-level" content="S">
    <title>Sovereign Console | Nous Loop</title>
    <style>
        :root { --navy: #0f172a; --gold: #f59e0b; --amber: #d97706; --bg: #0A0A0B; }
        body { background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .panel { background: var(--navy); border: 1px solid var(--amber); padding: 15px; border-radius: 4px; }
        h2 { color: var(--amber); border-bottom: 1px solid var(--amber); padding-bottom: 5px; font-size: 1.2rem; }
        #pulse-feed { height: 400px; overflow-y: auto; font-size: 0.85rem; }
        .pulse-card { border-left: 3px solid var(--gold); padding: 8px; margin-bottom: 10px; background: rgba(0,0,0,0.3); }
        input { width: 100%; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 10px; margin-top: 10px; }
        #library-res { margin-top: 15px; color: #ccc; font-style: italic; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; background: #065f46; color: #fff; }
    </style>
</head>
<body>
    <header style="margin-bottom: 20px;">
        <h1 style="margin:0;">THE EMERALD CITY <span style="font-size: 1rem; color: var(--amber);">[VDS 90000]</span></h1>
        <div id="connection-status"><span class="status-tag">SYST_OK</span> Connected to nousloop.cloudflareaccess.com</div>
    </header>

    <div class="grid">
        <aside class="panel">
            <h2>System Health</h2>
            <p>Vault: <span id="vault-count">Syncing...</span></p>
            <p>Refinery: <span style="color: #22c55e;">ONLINE</span></p>
            <hr style="border: 0; border-top: 1px solid var(--navy);">
            <h2>Library Oracle</h2>
            <input type="text" id="query-input" placeholder="Ask the Library...">
            <div id="library-res">The Oracle is silent.</div>
        </aside>

        <main class="panel">
            <h2>Live Tesseract Feed (Vectorize)</h2>
            <div id="pulse-feed">Initiating link to Pool of Tears...</div>
        </main>
    </div>

    <script>
        const API = 'https://api.nousloop.com';

        // Pulse Polling: Vectorize Vault (score ≥ 0.6). Real-time somatic math from the Pool of Tears.
        async function updateFeed() {
            try {
                const res = await fetch(API + '/v1/console/pulses');
                const data = await res.json();
                const pulses = data.pulses || [];
                document.getElementById('vault-count').innerText = pulses.length + " vectors";

                const feed = document.getElementById('pulse-feed');
                if (pulses.length === 0) {
                    feed.innerHTML = 'No pulses above threshold in the Pool of Tears.';
                    return;
                }
                feed.innerHTML = pulses.map(p => {
                    const meta = p.metadata || {};
                    const ts = meta.timestamp != null ? new Date(meta.timestamp).toLocaleTimeString() : '—';
                    const mask = (meta.mask != null ? String(meta.mask) : '').substring(0, 8);
                    return `<div class="pulse-card">
                        [${ts}] MASK: ${mask}...<br>
                        VDS_VECTOR: [archived 1024-dim] score ${(p.score != null ? p.score.toFixed(3) : '—')}
                    </div>`;
                }).join('');
            } catch (e) {
                console.error("Link severed", e);
                document.getElementById('pulse-feed').innerText = 'Initiating link to Pool of Tears...';
            }
        }

        // Library Oracle: /v1/ask returns { answer, sources } (R2 docs via AI Search).
        document.getElementById('query-input').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const resBox = document.getElementById('library-res');
                resBox.innerText = "Consulting archives...";
                const query = encodeURIComponent(e.target.value.trim() || '');
                try {
                    const response = await fetch(API + '/v1/ask?q=' + query);
                    const result = await response.json();
                    const answer = result.answer != null ? result.answer : (result.error || "The Oracle is silent.");
                    const sources = result.sources && result.sources.length ? "\nSources: " + result.sources.join(", ") : "";
                    resBox.innerText = answer + sources;
                } catch (err) {
                    resBox.innerText = "The Oracle encountered a logic loop.";
                }
            }
        });

        setInterval(updateFeed, 5000);
        updateFeed();
    </script>
</body>
</html>
